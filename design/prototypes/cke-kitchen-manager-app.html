<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CKE kitchen and manager app prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#C83F2D;--red-deep:#A32A1B;--red-light:#E4604C;--yellow:#F2B544;--cream:#FFF3DF;--char:#292522;
  --kraft:#E2C9A3;--kraft-shade:#CDAE84;--muted:#5B534E;--border:#D9CDB8;--white:#FFFFFF;--black:#000000;
  --green:#1B7A3A;--green-light:#5CC47E;
  --chrome-bg:#E6E0D6;--chrome-panel:#F7F4EF;--chrome-text:#292522;--chrome-muted:#5B534E;--chrome-line:#D3CABD;
  --chrome-accent:#A32A1B;--chrome-chip:#EDE6DA;--chrome-chip-on:#292522;--chrome-chip-on-text:#FFF3DF;--bezel:#1C1917;
  --font-head:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --chrome-bg:#141110;--chrome-panel:#1F1B19;--chrome-text:#FFF3DF;--chrome-muted:#CFC4B5;--chrome-line:#3A332E;
    --chrome-accent:#E4604C;--chrome-chip:#2A2522;--chrome-chip-on:#FFF3DF;--chrome-chip-on-text:#292522;--bezel:#000000;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --chrome-bg:#141110;--chrome-panel:#1F1B19;--chrome-text:#FFF3DF;--chrome-muted:#CFC4B5;--chrome-line:#3A332E;
  --chrome-accent:#E4604C;--chrome-chip:#2A2522;--chrome-chip-on:#FFF3DF;--chrome-chip-on-text:#292522;--bezel:#000000;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--chrome-bg);color:var(--chrome-text);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--chrome-accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- prototype chrome ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--chrome-panel)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--chrome-panel);border-bottom:1px solid var(--chrome-line)}
.topbar .mark{width:44px;height:34px;flex:none}
.topbar h1{font-family:var(--font-head);font-weight:800;font-size:19px;line-height:1.15;margin:0}
.topbar p{margin:0;font-size:13px;color:var(--chrome-muted)}
.topbar .grow{flex:1 1 auto;min-width:0}
.proto-links{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.proto-links a,.chrome-btn{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--chrome-line);background:transparent;text-decoration:none;font-size:13px;font-weight:600;color:var(--chrome-text)}
.proto-links a[aria-current="page"]{background:var(--chrome-chip-on);color:var(--chrome-chip-on-text);border-color:var(--chrome-chip-on)}
.shell{display:grid;grid-template-columns:272px minmax(0,1fr) 300px;align-items:start}
.flows,.notes{position:sticky;top:64px;max-height:calc(100vh - 64px);overflow:auto;padding:18px 16px 40px}
.flows summary{font-family:var(--font-head);font-weight:800;font-size:16px;cursor:pointer;list-style:none;margin-bottom:6px}
.flows summary::-webkit-details-marker{display:none}
.flow{margin:14px 0 4px}
.flow h2{font-family:var(--font-head);font-weight:800;font-size:14px;margin:0 0 4px;color:var(--chrome-text)}
.flow ol{margin:0;padding:0 0 0 22px;color:var(--chrome-muted);font-size:13.5px}
.flow li{margin:1px 0}
.flow a{display:block;padding:4px 8px;margin-left:-8px;border-radius:8px;text-decoration:none;color:var(--chrome-text)}
.flow a:hover{background:var(--chrome-chip)}
.flow a[aria-current="page"]{background:var(--chrome-chip-on);color:var(--chrome-chip-on-text);font-weight:600}
.stage{padding:22px 12px 40px;display:flex;justify-content:center;min-width:0}
.device-wrap{position:relative;flex:none}
.device{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--bezel);border-radius:52px;padding:12px;box-shadow:0 40px 60px -40px rgba(0,0,0,.55)}
.device.phone{width:414px;height:868px}
.device.tablet{width:1208px;height:848px;border-radius:30px;padding:14px}
.scr{position:relative;width:100%;height:100%;overflow:hidden;border-radius:40px;background:#fff;isolation:isolate}
.device.tablet .scr{border-radius:18px}
.notes h2{font-family:var(--font-head);font-weight:800;font-size:17px;line-height:1.25;margin:0 0 6px}
.notes h3{font-size:13px;font-weight:700;margin:14px 0 4px;color:var(--chrome-muted)}
.notes p{margin:0 0 8px;font-size:14px}
.note,.demo{background:var(--chrome-panel);border:1px solid var(--chrome-line);border-radius:14px;padding:14px 14px 12px;margin-bottom:14px}
.ids{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.ids li{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--chrome-chip);color:var(--chrome-text)}
.next-btn{margin-top:12px;width:100%;min-height:40px;border-radius:10px;border:0;background:var(--chrome-chip-on);color:var(--chrome-chip-on-text);font-weight:600}
.demo-row{margin:10px 0}
.demo-row > span{display:block;font-size:12.5px;font-weight:600;color:var(--chrome-muted);margin-bottom:4px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{min-height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--chrome-line);background:transparent;font-size:13px;color:var(--chrome-text)}
.seg button[aria-pressed="true"]{background:var(--chrome-chip-on);color:var(--chrome-chip-on-text);border-color:var(--chrome-chip-on)}
.demo .wide{width:100%;min-height:36px;border-radius:9px;border:1px solid var(--chrome-line);background:transparent;margin-top:4px;font-size:13px;font-weight:600;color:var(--chrome-text)}

@media (max-width:1180px){
  .shell{grid-template-columns:240px minmax(0,1fr)}
  .notes{grid-column:1 / -1;position:static;max-height:none;display:grid;grid-template-columns:1fr 1fr;gap:14px}
}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .flows{position:static;max-height:none;padding-bottom:4px}
  .flows details:not([open]){margin-bottom:0}
  .notes{grid-template-columns:1fr}
  .topbar{flex-wrap:wrap}
  .proto-links{justify-content:flex-start}
}

/* ---------- inside-app shared bits ---------- */
.statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 32px;font-size:14px;font-weight:600;flex:none}
.statusbar svg{display:block}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);z-index:50;max-width:86%;padding:10px 16px;border-radius:12px;background:#292522;color:#FFF3DF;font-size:14px;font-weight:500;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);animation:toastIn .25s ease-out}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.photo-ph{position:relative;display:flex;align-items:flex-end;justify-content:flex-start;overflow:hidden;background:linear-gradient(135deg,#E8D3B2,#D9BA8E);color:#5B3F23}
.photo-ph svg.dish{position:absolute;right:-6%;top:50%;transform:translateY(-50%);width:62%;height:auto;opacity:.9}
.photo-ph .ph-note{position:relative;margin:8px;padding:2px 8px;border-radius:6px;background:rgba(255,243,223,.85);font-size:11px;font-weight:600;color:#5B3F23}

.kapp{--k-bg:#FFF8EE;--k-surface:#FFFFFF;--k-text:#292522;--k-muted:#5B534E;--k-line:#E6DCCB;--k-primary:#C83F2D;--k-on-primary:#FFFFFF;--k-rail:#292522;--k-on-rail:#FFF3DF;--k-chip:#F3E8D6;
  --k-new:#F2B544;--k-on-new:#292522;--k-prep:#DCE3EA;--k-on-prep:#1F2A36;--k-ready:#1B7A3A;--k-on-ready:#FFFFFF;--k-alert:#A32A1B;--k-on-alert:#FFFFFF;
  position:absolute;inset:0;display:grid;grid-template-columns:104px minmax(0,1fr);background:var(--k-bg);color:var(--k-text);font-family:var(--font-body);font-size:16px;line-height:1.4}
.kapp[data-mode="dark"]{--k-bg:#1F1B19;--k-surface:#2A2522;--k-text:#FFF3DF;--k-muted:#CFC4B5;--k-line:#3A332E;--k-primary:#FFF3DF;--k-on-primary:#292522;--k-rail:#000000;--k-on-rail:#FFF3DF;--k-chip:#332C28;--k-prep:#2E3A46;--k-on-prep:#E6EDF4}
.kapp.nosidebar{grid-template-columns:minmax(0,1fr)}
.kapp :focus-visible{outline:3px solid #F2B544;outline-offset:2px}
.kapp h1,.kapp h2,.kapp h3{font-family:var(--font-head);margin:0;line-height:1.15}
.rail{background:var(--k-rail);color:var(--k-on-rail);display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:14px 8px;overflow-y:auto}
.rail .brand{display:flex;justify-content:center;margin-bottom:10px}
.rail button{border:0;background:transparent;color:inherit;border-radius:12px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;opacity:.82;padding:4px}
.rail button[aria-current="page"]{background:rgba(255,243,223,.16);opacity:1}
.rail hr{border:0;border-top:1px solid rgba(255,243,223,.2);margin:6px 6px}
.rail small{font-size:10.5px;opacity:.7;text-align:center;margin:2px 0 2px}
.kmain{display:flex;flex-direction:column;min-width:0;min-height:0}
.ktop{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--k-line);background:var(--k-surface);flex:none;flex-wrap:nowrap}
.ktop h1{font-size:22px;font-weight:800;white-space:nowrap}
.ktop .grow{flex:1}
.who{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:999px;background:var(--k-chip);font-size:14px;font-weight:600;white-space:nowrap}
.who .ini{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#8A5A3B,#C99A6B);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.kbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:0;background:var(--k-primary);color:var(--k-on-primary);font-weight:700;font-size:15.5px;white-space:nowrap}
.kbtn.ghost{background:transparent;color:var(--k-text);border:1.5px solid var(--k-line)}
.kbtn.alert{background:var(--k-alert);color:var(--k-on-alert)}
.kbtn.ok{background:var(--k-ready);color:var(--k-on-ready)}
.kbtn.big{min-height:60px;font-size:18px;width:100%}
.kbtn[disabled]{opacity:.45;cursor:not-allowed}
.ksegs{display:inline-flex;background:var(--k-chip);border-radius:12px;padding:3px;gap:3px}
.ksegs button{min-height:40px;padding:0 14px;border:0;border-radius:9px;background:transparent;font-weight:600;color:var(--k-muted);font-size:14.5px;white-space:nowrap}
.ksegs button[aria-pressed="true"]{background:var(--k-surface);color:var(--k-text);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.toggle{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:12px;border:1.5px solid var(--k-line);background:transparent;font-weight:600;font-size:14px;color:var(--k-text);white-space:nowrap}
.toggle i{width:38px;height:22px;border-radius:11px;background:var(--k-line);position:relative;flex:none}
.toggle i::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.toggle[aria-pressed="true"] i{background:var(--k-alert)}
.toggle[aria-pressed="true"] i::after{left:19px}
.toggle.green[aria-pressed="true"] i{background:var(--k-ready)}
.kbody{flex:1 1 auto;overflow:auto;padding:16px 18px 24px;min-height:0}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;height:100%}
.col{display:flex;flex-direction:column;min-height:0;background:var(--k-chip);border-radius:16px;overflow:hidden}
.colhead{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;font-family:var(--font-head);font-weight:800;font-size:18px}
.colhead.new{background:var(--k-new);color:var(--k-on-new)}
.colhead.prep{background:var(--k-prep);color:var(--k-on-prep)}
.colhead.ready{background:var(--k-ready);color:var(--k-on-ready)}
.colhead span{display:inline-flex;align-items:center;gap:8px}
.colbody{padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.ticket{background:var(--k-surface);border:1px solid var(--k-line);border-radius:14px;padding:12px;text-align:left;color:var(--k-text);width:100%}
.ticket .tno{font-family:var(--font-head);font-weight:800;font-size:28px;line-height:1}
.ticket .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ticket ul{margin:8px 0;padding:0 0 0 18px;font-size:15px}
.ticket .meta{font-size:13px;color:var(--k-muted)}
.ticket.late{border:2px solid var(--k-alert)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--k-chip);color:var(--k-text);white-space:nowrap}
.badge.walk{background:#E2C9A3;color:#292522}
.badge.del{background:#292522;color:#FFF3DF}
.kapp[data-mode="dark"] .badge.del{background:#FFF3DF;color:#292522}
.badge.alert{background:var(--k-alert);color:var(--k-on-alert)}
.badge.ok{background:var(--k-ready);color:var(--k-on-ready)}
.banner-k{padding:10px 14px;border-radius:12px;background:var(--k-alert);color:var(--k-on-alert);font-weight:700;margin-bottom:12px}
.kcard{background:var(--k-surface);border:1px solid var(--k-line);border-radius:16px;padding:16px;margin-bottom:14px}
.kcard h2{font-size:18px;font-weight:800;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--k-surface);border:1px solid var(--k-line);border-radius:16px;padding:14px 16px}
.kpi .v{font-family:var(--font-head);font-weight:800;font-size:30px;line-height:1.05}
.kpi .l{font-size:13.5px;color:var(--k-muted);font-weight:600}
.kpi .s{font-size:13px;color:var(--k-muted);margin-top:4px}
.ktable{width:100%;border-collapse:collapse;font-size:14.5px}
.ktable th{text-align:left;font-size:13px;color:var(--k-muted);font-weight:600;padding:8px 10px;border-bottom:1.5px solid var(--k-line);white-space:nowrap}
.ktable th button{all:unset;cursor:pointer;font-weight:700;color:var(--k-text)}
.ktable td{padding:10px;border-bottom:1px solid var(--k-line);vertical-align:middle}
.ktable tr.click{cursor:pointer}
.ktable tr.click:hover td{background:var(--k-chip)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.kfield{display:block;margin:0 0 12px}
.kfield span{display:block;font-size:13.5px;font-weight:600;margin-bottom:5px}
.kfield input,.kfield select,.kfield textarea{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--k-line);background:var(--k-surface);padding:0 12px;color:var(--k-text)}
.kfield textarea{min-height:76px;padding:10px 12px}
.kfield em{font-style:normal;color:var(--k-muted);font-weight:500}
.walk{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;height:100%}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{min-height:104px;border-radius:14px;border:1.5px solid var(--k-line);background:var(--k-surface);color:var(--k-text);text-align:left;padding:12px;display:flex;flex-direction:column;justify-content:space-between}
.tile b{font-size:16px;line-height:1.2}
.tile span{font-weight:700;color:var(--k-muted)}
.tile[disabled]{opacity:.45}
.summary{background:var(--k-surface);border:1px solid var(--k-line);border-radius:16px;padding:14px;display:flex;flex-direction:column;min-height:0}
.summary .lines{flex:1;overflow:auto;margin:8px 0}
.sline{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--k-line)}
.kqty{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.kqty button{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--k-line);background:var(--k-surface);color:var(--k-text);font-size:18px}
.total{display:flex;justify-content:space-between;font-family:var(--font-head);font-weight:800;font-size:24px;margin:8px 0 10px}
.cashgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cashgrid button{min-height:64px;border-radius:14px;border:1.5px solid var(--k-line);background:var(--k-surface);color:var(--k-text);font-weight:700;font-size:18px}
.cashgrid button[aria-pressed="true"]{border:3px solid var(--k-text)}
.callout{font-family:var(--font-head);font-weight:800;font-size:120px;line-height:1;letter-spacing:.02em}
.ticklist button{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;border-radius:12px;border:1.5px solid var(--k-line);background:var(--k-surface);color:var(--k-text);font-weight:600;font-size:16px;padding:0 14px;margin:6px 0;text-align:left}
.ticklist button i{width:28px;height:28px;border-radius:8px;border:2px solid var(--k-line);display:grid;place-items:center;flex:none}
.ticklist button[aria-pressed="true"] i{background:var(--k-ready);border-color:var(--k-ready);color:#fff}
.ticklist button[aria-pressed="true"]{color:var(--k-muted);text-decoration:line-through}
.tline{list-style:none;margin:0;padding:0}
.tline li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--k-line);font-size:14.5px}
.tline li b{font-variant-numeric:tabular-nums}
.tline small{display:block;color:var(--k-muted)}
.modal-back{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:30;border:0}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:31;width:460px;max-width:92%;background:var(--k-surface);color:var(--k-text);border-radius:20px;padding:22px}
.modal h2{font-size:22px;font-weight:800;margin-bottom:6px}
.modal p{color:var(--k-muted);margin:0 0 14px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
.chartbox svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;font-size:13px;color:var(--k-muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
.demo-chip{font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:999px;background:#F2B544;color:#292522}
.signin{display:grid;grid-template-columns:1fr 1fr;height:100%}
.signin .left{background:#292522;color:#FFF3DF;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:60px}
.signin .right{display:flex;flex-direction:column;justify-content:center;padding:60px 70px;background:var(--k-bg)}
.gbtn-k{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;border-radius:12px;background:#fff;color:#1f1f1f;border:1.5px solid #747775;font-weight:600}
.compress{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:stretch}
.compress .photo-ph{border-radius:12px}
.empty{padding:20px;text-align:center;color:var(--k-muted);font-size:14.5px}

</style>

<script>
/* ---------- shared prototype engine ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const naira = n => "₦" + Math.round(n).toLocaleString("en-US");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const SCREENS = {};
let FLOWS = [];
let DEFAULT_SCREEN = null;
let lastScreen = null;
const ACT = {};
const INPUT = {};
let APP_NAME = "CKE prototype";
let renderDemo = () => "";

function screen(id, cfg) { SCREENS[id] = cfg; }
function current() { const h = location.hash.slice(1); return SCREENS[h] ? h : DEFAULT_SCREEN; }
function go(id) {
  if (!SCREENS[id]) return;
  if (location.hash.slice(1) === id) { enterAndRender(id); } else { location.hash = id; }
}
function enterAndRender(id) {
  const sc = SCREENS[id];
  if (sc && sc.enter && lastScreen !== id) sc.enter();
  render();
}
function render() {
  const id = current();
  const sc = SCREENS[id];
  const app = $("#app");
  const scrollEl = app.querySelector(".scroll");
  const keep = id === lastScreen && scrollEl ? scrollEl.scrollTop : 0;
  app.innerHTML = sc.render();
  const ns = app.querySelector(".scroll");
  if (ns) ns.scrollTop = keep;
  lastScreen = id;
  $$("[data-nav]").forEach(a => a.setAttribute("aria-current", a.dataset.nav === id ? "page" : "false"));
  $("#note-title").textContent = sc.title;
  $("#note-body").innerHTML = sc.note || "";
  $("#note-ids").innerHTML = (sc.ids || []).map(x => `<li>${x}</li>`).join("") || "<li>Supporting screen</li>";
  const nxt = nextInFlow(id);
  $("#note-next").innerHTML = nxt ? `<button class="next-btn" data-go="${nxt}">Next in this flow: ${esc(SCREENS[nxt].title)}</button>` : "";
  $("#demo").innerHTML = renderDemo();
  document.title = sc.title + " – " + APP_NAME;
  if (sc.after) sc.after(app);
}
function nextInFlow(id) {
  for (const f of FLOWS) {
    const i = f.screens.indexOf(id);
    if (i > -1 && i < f.screens.length - 1) return f.screens[i + 1];
  }
  return null;
}
function buildFlows() {
  $("#flowlist").innerHTML = FLOWS.map(f => `
    <div class="flow"><h2>${esc(f.name)}</h2>
      <ol>${f.screens.map(s => `<li><a href="#${s}" data-nav="${s}">${esc(SCREENS[s].title)}</a></li>`).join("")}</ol>
    </div>`).join("");
}
function toast(msg) {
  const scr = $("#app");
  const t = document.createElement("div");
  t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  scr.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
function fit() {
  const dev = $(".device"); const wrap = $(".device-wrap"); const stage = $(".stage");
  if (!dev || !wrap || !stage) return;
  const dw = dev.offsetWidth, dh = dev.offsetHeight;
  const sw = stage.clientWidth - 24;
  const top = stage.getBoundingClientRect().top;
  const narrow = window.innerWidth <= 820;
  const vh = window.innerHeight - Math.max(top, 64) - 30;
  let s = Math.min(1, sw / dw, narrow ? 1 : Math.max(vh, 520) / dh);
  s = Math.max(s, 0.3);
  dev.style.transform = `scale(${s})`;
  wrap.style.width = dw * s + "px";
  wrap.style.height = dh * s + "px";
}
function chromeTheme(mode) {
  const r = document.documentElement;
  if (mode === "auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", mode);
  try { localStorage.setItem("cke-proto-theme", mode); } catch (e) {}
}
function seg(name, options, value, act) {
  return `<div class="demo-row"><span>${name}</span><div class="seg">${options.map(([v, label]) =>
    `<button data-act="${act}" data-v="${v}" aria-pressed="${v === value}">${label}</button>`).join("")}</div></div>`;
}
function boot(defaultId, appName) {
  DEFAULT_SCREEN = defaultId; APP_NAME = appName;
  buildFlows();
  let saved = "auto";
  try { saved = localStorage.getItem("cke-proto-theme") || "auto"; } catch (e) {}
  chromeTheme(saved);
  document.addEventListener("click", e => {
    const g = e.target.closest("[data-go]");
    if (g) { e.preventDefault(); go(g.dataset.go); return; }
    const a = e.target.closest("[data-act]");
    if (a && ACT[a.dataset.act]) {
      e.preventDefault();
      const r = ACT[a.dataset.act](a.dataset, a, e);
      if (r !== false) render();
    }
    const t = e.target.closest("[data-chrome-theme]");
    if (t) { const order = ["auto", "light", "dark"]; let cur = "auto"; try { cur = localStorage.getItem("cke-proto-theme") || "auto"; } catch (er) {} const nx = order[(order.indexOf(cur) + 1) % 3]; chromeTheme(nx); t.textContent = "Page theme: " + ({ auto: "follow device", light: "light", dark: "dark" }[nx]); }
  });
  document.addEventListener("keydown", e => {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-act]:not(button):not(input):not(select):not(textarea)")) { e.preventDefault(); e.target.click(); }
  });
  const onField = e => { const a = e.target.closest("[data-input]"); if (a && INPUT[a.dataset.input]) INPUT[a.dataset.input](a, e); };
  document.addEventListener("input", onField);

function sumDays(list, ch) { const r = { orders: 0, sales: 0 }; list.forEach(d => { if (ch !== "walkin") { r.orders += d.online; r.sales += d.onSales; } if (ch !== "online") { r.orders += d.walkin; r.sales += d.wiSales; } }); return r; }
function hourBars(ch, scale = 1) {
  const W = 640, H = 190, pad = 26; const hours = []; for (let h = 8; h <= 20; h++) hours.push(h);
  const onT = Object.values(ON_W).reduce((a, b) => a + b, 0), wiT = Object.values(WI_W).reduce((a, b) => a + b, 0);

  const max = Math.max(...hours.map((h, i) => on[i] + wi[i])) || 1; const bw = (W - pad * 2) / hours.length;

    <line x1="${pad + 10 * bw}" y1="10" x2="${pad + 10 * bw}" y2="${H - 24}" stroke="currentColor" stroke-dasharray="3 4" opacity=".5"/><text x="${pad + 10 * bw + 4}" y="20" font-size="11" fill="currentColor" opacity=".75">Online closes 6:00 pm</text></svg>`;

function lineChart(list, ch, key = "orders") {

  const pt = (v, i) => `${pad + i * (W - pad * 2) / Math.max(1, n - 1)},${H - 24 - v / max * (H - 40)}`;

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${key === "orders" ? "Orders" : "Sales"} per day">${ch !== "walkin" ? `<polyline points="${path(on)}" fill="none" stroke="#C83F2D" stroke-width="2.5"/>` : ""}${ch !== "online" ? `<polyline points="${path(wi)}" fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="6 5"/>` : ""}
    <text x="${pad}" y="${H - 6}" font-size="11" fill="currentColor" opacity=".7">${dayLabel(list[0].d)}</text><text x="${W - pad}" y="${H - 6}" font-size="11" text-anchor="end" fill="currentColor" opacity=".7">${dayLabel(list[n - 1].d)}</text></svg>`;
}

function period() {

}

function moveTicket(t) { if (t.stage === "new") { t.stage = "prep"; t.ackBy = short(K.person) + " (" + K.person.code + ")"; } else if (t.stage === "prep") t.stage = "ready"; else K.tickets = K.tickets.filter(x => x !== t); }
let autoTimer = null;
function setAuto(on) { clearInterval(autoTimer); autoTimer = null; if (on) autoTimer = setInterval(() => { ACT.stepDemo(); if (["k-board", "m-dash", "m-demo"].includes(current())) render(); }, { "1x": 4000, "5x": 1600, "20x": 700 }[K.speed]); }
Object.assign(ACT, {
  signIn: d => { K.signedIn = true; K.role = d.v; K.person = d.v === "manager" ? STAFF.managers[0] : STAFF.kitchen[0]; go(d.v === "manager" ? "m-dash" : "k-board"); return false; },
  signOut: () => { K.signedIn = false; go("k-signin"); return false; },
  filter: d => { K.filter = d.v; },
  pause: () => { K.paused = !K.paused; toast(K.paused ? "New online orders paused" : "Taking online orders again"); },
  ack: d => { const t = tk(d.no); moveTicket(t); toast(d.no + " acknowledged by " + short(K.person)); },
  ready: d => { const t = tk(d.no); t.stage = "ready"; toast(d.no + " is ready"); if (current() === "k-ticket") { go("k-board"); return false; } },
  collected: d => { K.tickets = K.tickets.filter(t => t.no !== d.no); toast(d.no + " collected"); if (current() === "k-ticket") { go("k-board"); return false; } },
  openTicket: d => { K.sel = d.no; go("k-ticket"); return false; },
  tick: d => { const t = tk(K.sel); t.ticked[d.i] = !t.ticked[d.i]; },
  unavailable: () => { toast("The manager is told, and contacts the customer"); return false; },
  modal: d => { K.modal = d.v; },
  closeModal: () => { K.modal = null; },
  doSwitch: () => { K.person = STAFF.kitchen[2]; K.modal = null; toast("Ruth A. (K-004) is signed in"); },
  doCancelWalk: () => { K.tickets = K.tickets.filter(t => t.no !== K.sel); K.modal = null; toast(K.sel + " cancelled and refunded"); go("k-board"); return false; },
  wcat: d => { K.walk.cat = d.v; },
  wadd: d => { const c = K.walk.cart.find(x => x.id === d.id); if (c) c.qty++; else K.walk.cart.push({ id: d.id, qty: 1 }); },
  wqty: d => { const c = K.walk.cart[d.i]; c.qty += Number(d.v); if (c.qty <= 0) K.walk.cart.splice(d.i, 1); },
  wtype: d => { K.walk.type = d.v; },
  method: d => { K.charge.method = d.v; },
  received: d => { K.charge.received = d.v; },
  onlineType: d => { K.charge.online = d.v; },
  confirmCharge: () => {
    const total = K.walk.cart.reduce((a, c) => a + km(c.id).price * c.qty, 0); const ch = K.charge;
    const rec = ch.method === "cash" ? (ch.received === "exact" ? total : Number(ch.received)) : null;
    const no = "W-" + String(K.nextW++).padStart(3, "0");
    const t = { no, ch: "walkin", type: K.walk.type, stage: "prep", placed: "12:34", age: 0, name: K.walk.name, items: K.walk.cart.map(c => [km(c.id).name, c.qty, km(c.id).station]), by: short(K.person) + " (" + K.person.code + ")", pay: ch.method === "cash" ? "Cash" : ch.online };
    K.tickets.push(t); K.lastWalk = { no, placed: "12:34", pay: t.pay, change: rec ? rec - total : 0 };
    K.walk = { cart: [], type: "Take away", name: "", cat: "rice" }; K.charge = { method: "cash", received: null, online: "Card" };
    go("k-walkdone"); return false;
  },
  newWalk: () => { K.walk = { cart: [], type: "Take away", name: "", cat: "rice" }; go("k-walkin"); return false; },
  soldToggle: d => { if (K.soldOut.has(d.id)) K.soldOut.delete(d.id); else K.soldOut.add(d.id); },
  alertDone: d => { K.alertsDone.add(d.v); toast(d.msg); },
  toastOnly: d => { toast(d.msg); return false; },
  oCh: d => { K.oCh = d.v; K.oShow = 150; }, oDay: d => { K.oDay = d.v; K.oShow = 150; },
  sort: d => { if (K.oSort === d.v) K.oDir *= -1; else { K.oSort = d.v; K.oDir = -1; } },
  openOrder: d => { K.selOrder = d.no; K.selNo = d.n; go("m-order"); return false; },
  oMore: () => { K.oShow += 150; },
  refundKind: d => { K.refundKind = d.v; },
  doRefund: () => { K.modal = null; toast("Refund recorded (simulated). The customer is notified."); },
  peopleTab: d => { K.peopleTab = d.v; },
  newPerson: d => { K.newPerson = { role: d.v === "riders" ? "Rider" : d.v === "kitchen" ? "Kitchen staff" : "Manager", name: "", job: d.v === "riders" ? "Delivery rider" : d.v === "kitchen" ? "Cook" : "Manager", photo: false }; go("m-person"); return false; },
  personPhoto: () => { K.newPerson.photo = true; },
  savePerson: () => { const code = { Rider: "R-005", "Kitchen staff": "K-006", Manager: "M-003" }[K.newPerson.role]; toast("Saved. Staff ID " + code); go("m-people"); return false; },
  editItem: d => { K.editItem = d.id; K.img = 0; go("m-item"); return false; },
  imgStep: () => { K.img = Math.min(2, K.img + 1); },
  imgReset: () => { K.img = 0; },
  saveItem: () => { toast("Item saved. It shows in the customer app straight away."); go("m-menu"); return false; },
  archiveItem: () => { toast("Archived. Past orders still show it."); go("m-menu"); return false; },
  doDeact: d => { K.deact.add(d.v); K.modal = null; toast(d.v + " deactivated and signed out"); },
  doReact: d => { K.deact.delete(d.v); K.modal = null; toast(d.v + " reactivated"); },
  lbSort: d => { if (K.lbSort === d.v) K.lbDir *= -1; else { K.lbSort = d.v; K.lbDir = -1; } },
  savePrices: () => { const f = parseInt(String(K.feeDraft ?? K.set.fee).replace(/\D/g, ""), 10), p = parseInt(String(K.payDraft ?? K.set.riderPay).replace(/\D/g, ""), 10);
    if (!f || !p) { toast("Enter both amounts in naira"); return false; } if (p > f) { toast("Rider pay can’t be more than the delivery fee"); return false; }
    K.set.fee = f; K.set.riderPay = p; K.feeDraft = null; K.payDraft = null; K.priceChanged = true; toast("Saved. The customer and rider apps now show " + naira(f) + " and " + naira(p) + "."); },
  doPay: d => { K.paid.add(d.v); K.modal = null; toast("Payout recorded (simulated)"); },
  repTab: d => { K.repTab = d.v; }, repPeriod: d => { K.repPeriod = d.v === "custom" ? "custom" : Number(d.v); }, repCh: d => { K.repCh = d.v; }, compare: () => { K.compare = !K.compare; },
  track: d => { K.set.track = d.v; }, area: d => { K.set.areas[d.v] = !K.set.areas[d.v]; }, kmode: d => { K.mode = d.v; },
  demoOrder: d => { if (d.v === "online") K.tickets.unshift({ no: "O-" + K.nextO++, ch: "online", type: "Delivery", stage: "new", placed: "12:35", age: 0, area: "Ekosodin", items: [["Jollof rice with chicken", 1, "Rice"], ["Meat pie", 1, "Snacks and drinks"]] });
    else K.tickets.push({ no: "W-" + String(K.nextW++).padStart(3, "0"), ch: "walkin", type: "Eat in", stage: "prep", placed: "12:35", age: 0, items: [["Office Lunch Combo", 1, "Rice"]], by: short(K.person) + " (" + K.person.code + ")", pay: "Cash" });
    toast("Simulated " + (d.v === "online" ? "online" : "walk-in") + " order added to the board"); },
  autoplay: () => { K.autoplay = !K.autoplay; setAuto(K.autoplay); },
  speed: d => { K.speed = d.v; if (K.autoplay) setAuto(true); },
  stepDemo: () => { const t = K.tickets.find(x => x.stage === "new") || K.tickets.find(x => x.stage === "prep") || K.tickets.find(x => x.stage === "ready"); if (t) { if (t.stage === "ready" && t.type === "Delivery" && !t.rider) t.rider = "Sam E. (R-004)"; else moveTicket(t); } },
  doResetDemo: () => { const keep = { role: K.role, person: K.person, signedIn: true, mode: K.mode }; kReset(); Object.assign(K, keep); toast("Demo data regenerated"); },
  dRole: d => { K.role = d.v; K.person = d.v === "manager" ? STAFF.managers[0] : STAFF.kitchen[0]; K.signedIn = true; if (d.v === "kitchen" && current().startsWith("m-")) { go("k-board"); return false; } },
  dMode: d => { K.mode = d.v; },
  dReset: () => { setAuto(false); kReset(); go("k-signin"); return false; }
});
Object.assign(INPUT, {
  wname: el => { K.walk.name = el.value; },
  oFrom: el => { K.oFrom = Number(el.value); K.oShow = 150; render(); }, oTo: el => { K.oTo = Number(el.value); K.oShow = 150; render(); },
  oQ: el => { K.oQ = el.value; K.oShow = 150; const pos = el.selectionStart; render(); const n = document.querySelector('[data-input="oQ"]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } },
  oStatus: el => { K.oStatus = el.value; render(); }, oStaff: el => { K.oStaff = el.value; render(); }, oPay: el => { K.oPay = el.value; render(); },
  pname: el => { K.newPerson.name = el.value; },
  feeDraft: el => { K.feeDraft = el.value; },
  payDraft: el => { K.payDraft = el.value; },
  from: el => { K.from = Number(el.value); render(); },
  to: el => { K.to = Number(el.value); render(); },
  prole: el => { K.newPerson.role = el.value; render(); }
});
renderDemo = () => seg("Signed in as", [["kitchen", "Kitchen staff"], ["manager", "Manager"]], K.role, "dRole")
  + seg("App theme", [["light", "Light"], ["dark", "Dark"]], K.mode, "dMode")
  + `<div class="demo-row"><span>Board</span><div class="seg"><button data-act="demoOrder" data-v="online">Add online order</button><button data-act="demoOrder" data-v="walkin">Add walk-in</button><button data-act="stepDemo">Move one step</button></div></div>`
  + `<button class="wide" data-act="dReset">Reset the prototype</button>`;
FLOWS = [
  { name: "Start of shift", screens: ["k-signin", "k-board"] },
  { name: "Online order in the kitchen", screens: ["k-board", "k-ticket", "k-alerts"] },
  { name: "Walk-in order at the counter", screens: ["k-walkin", "k-charge", "k-walkdone"] },
  { name: "Kitchen tools", screens: ["k-soldout"] },
  { name: "Manager: today", screens: ["m-dash", "m-orders", "m-order"] },
  { name: "Manager: team and menu", screens: ["m-people", "m-person", "m-menu", "m-item", "m-pay"] },
  { name: "Manager: insight and setup", screens: ["m-reports", "m-setup", "m-demo"] }
];
if (window.innerWidth <= 820) { const d = document.getElementById("flows-d"); if (d) d.open = false; }
boot("k-signin", "CKE kitchen and manager app prototype");

</script>
</body>
</html>
