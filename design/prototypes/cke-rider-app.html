<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CKE rider app prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#C83F2D;--red-deep:#A32A1B;--red-light:#E4604C;--yellow:#F2B544;--cream:#FFF3DF;--char:#292522;
  --kraft:#E2C9A3;--kraft-shade:#CDAE84;--muted:#5B534E;--border:#D9CDB8;--white:#FFFFFF;--black:#000000;
  --green:#1B7A3A;--green-light:#5CC47E;
  --chrome-bg:#E6E0D6;--chrome-panel:#F7F4EF;--chrome-text:#292522;--chrome-muted:#5B534E;--chrome-line:#D3CABD;
  --chrome-accent:#A32A1B;--chrome-chip:#EDE6DA;--chrome-chip-on:#292522;--chrome-chip-on-text:#FFF3DF;--bezel:#1C1917;
  --font-head:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --chrome-bg:#141110;--chrome-panel:#1F1B19;--chrome-text:#FFF3DF;--chrome-muted:#CFC4B5;--chrome-line:#3A332E;
    --chrome-accent:#E4604C;--chrome-chip:#2A2522;--chrome-chip-on:#FFF3DF;--chrome-chip-on-text:#292522;--bezel:#000000;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --chrome-bg:#141110;--chrome-panel:#1F1B19;--chrome-text:#FFF3DF;--chrome-muted:#CFC4B5;--chrome-line:#3A332E;
  --chrome-accent:#E4604C;--chrome-chip:#2A2522;--chrome-chip-on:#FFF3DF;--chrome-chip-on-text:#292522;--bezel:#000000;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--chrome-bg);color:var(--chrome-text);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--chrome-accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- prototype chrome ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--chrome-panel)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--chrome-panel);border-bottom:1px solid var(--chrome-line)}
.topbar .mark{width:44px;height:34px;flex:none}
.topbar h1{font-family:var(--font-head);font-weight:800;font-size:19px;line-height:1.15;margin:0}
.topbar p{margin:0;font-size:13px;color:var(--chrome-muted)}
.topbar .grow{flex:1 1 auto;min-width:0}
.proto-links{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.proto-links a,.chrome-btn{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--chrome-line);background:transparent;text-decoration:none;font-size:13px;font-weight:600;color:var(--chrome-text)}
.proto-links a[aria-current="page"]{background:var(--chrome-chip-on);color:var(--chrome-chip-on-text);border-color:var(--chrome-chip-on)}
.shell{display:grid;grid-template-columns:272px minmax(0,1fr) 300px;align-items:start}
.flows,.notes{position:sticky;top:64px;max-height:calc(100vh - 64px);overflow:auto;padding:18px 16px 40px}
.flows summary{font-family:var(--font-head);font-weight:800;font-size:16px;cursor:pointer;list-style:none;margin-bottom:6px}
.flows summary::-webkit-details-marker{display:none}
.flow{margin:14px 0 4px}
.flow h2{font-family:var(--font-head);font-weight:800;font-size:14px;margin:0 0 4px;color:var(--chrome-text)}
.flow ol{margin:0;padding:0 0 0 22px;color:var(--chrome-muted);font-size:13.5px}
.flow li{margin:1px 0}
.flow a{display:block;padding:4px 8px;margin-left:-8px;border-radius:8px;text-decoration:none;color:var(--chrome-text)}
.flow a:hover{background:var(--chrome-chip)}
.flow a[aria-current="page"]{background:var(--chrome-chip-on);color:var(--chrome-chip-on-text);font-weight:600}
.stage{padding:22px 12px 40px;display:flex;justify-content:center;min-width:0}
.device-wrap{position:relative;flex:none}
.device{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--bezel);border-radius:52px;padding:12px;box-shadow:0 40px 60px -40px rgba(0,0,0,.55)}
.device.phone{width:414px;height:868px}
.device.tablet{width:1208px;height:848px;border-radius:30px;padding:14px}
.scr{position:relative;width:100%;height:100%;overflow:hidden;border-radius:40px;background:#fff;isolation:isolate}
.device.tablet .scr{border-radius:18px}
.notes h2{font-family:var(--font-head);font-weight:800;font-size:17px;line-height:1.25;margin:0 0 6px}
.notes h3{font-size:13px;font-weight:700;margin:14px 0 4px;color:var(--chrome-muted)}
.notes p{margin:0 0 8px;font-size:14px}
.note,.demo{background:var(--chrome-panel);border:1px solid var(--chrome-line);border-radius:14px;padding:14px 14px 12px;margin-bottom:14px}
.ids{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.ids li{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--chrome-chip);color:var(--chrome-text)}
.next-btn{margin-top:12px;width:100%;min-height:40px;border-radius:10px;border:0;background:var(--chrome-chip-on);color:var(--chrome-chip-on-text);font-weight:600}
.demo-row{margin:10px 0}
.demo-row > span{display:block;font-size:12.5px;font-weight:600;color:var(--chrome-muted);margin-bottom:4px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{min-height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--chrome-line);background:transparent;font-size:13px;color:var(--chrome-text)}
.seg button[aria-pressed="true"]{background:var(--chrome-chip-on);color:var(--chrome-chip-on-text);border-color:var(--chrome-chip-on)}
.demo .wide{width:100%;min-height:36px;border-radius:9px;border:1px solid var(--chrome-line);background:transparent;margin-top:4px;font-size:13px;font-weight:600;color:var(--chrome-text)}

@media (max-width:1180px){
  .shell{grid-template-columns:240px minmax(0,1fr)}
  .notes{grid-column:1 / -1;position:static;max-height:none;display:grid;grid-template-columns:1fr 1fr;gap:14px}
}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .flows{position:static;max-height:none;padding-bottom:4px}
  .flows details:not([open]){margin-bottom:0}
  .notes{grid-template-columns:1fr}
  .topbar{flex-wrap:wrap}
  .proto-links{justify-content:flex-start}
}

/* ---------- inside-app shared bits ---------- */
.statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 32px;font-size:14px;font-weight:600;flex:none}
.statusbar svg{display:block}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);z-index:50;max-width:86%;padding:10px 16px;border-radius:12px;background:#292522;color:#FFF3DF;font-size:14px;font-weight:500;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);animation:toastIn .25s ease-out}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.photo-ph{position:relative;display:flex;align-items:flex-end;justify-content:flex-start;overflow:hidden;background:linear-gradient(135deg,#E8D3B2,#D9BA8E);color:#5B3F23}
.photo-ph svg.dish{position:absolute;right:-6%;top:50%;transform:translateY(-50%);width:62%;height:auto;opacity:.9}
.photo-ph .ph-note{position:relative;margin:8px;padding:2px 8px;border-radius:6px;background:rgba(255,243,223,.85);font-size:11px;font-weight:600;color:#5B3F23}

.rapp{--r-bg:#FFFFFF;--r-surface:#F2F2F2;--r-text:#000000;--r-muted:#4A4A4A;--r-line:#000000;--r-soft:#D9D9D9;--r-primary:#000000;--r-on-primary:#FFFFFF;--r-alert:#A32A1B;--r-on-alert:#FFFFFF;--r-success:#1B7A3A;--r-on-success:#FFFFFF;
  position:absolute;inset:0;display:flex;flex-direction:column;background:var(--r-bg);color:var(--r-text);font-family:var(--font-body);font-size:18px;line-height:1.4}
.rapp[data-mode="dark"]{--r-bg:#000000;--r-surface:#121212;--r-text:#FFFFFF;--r-muted:#C7C7C7;--r-line:#FFFFFF;--r-soft:#333333;--r-primary:#FFFFFF;--r-on-primary:#000000;--r-alert:#E4604C;--r-on-alert:#000000;--r-success:#5CC47E;--r-on-success:#000000}
.rapp :focus-visible{outline:4px solid #F2B544;outline-offset:2px}
.rapp h1,.rapp h2{font-family:var(--font-head);margin:0;line-height:1.1}
.rapp .scroll{flex:1 1 auto;overflow-y:auto;padding:4px 20px 120px}
.rapp .scroll.action{padding-bottom:210px}
.r-top{display:flex;align-items:center;gap:12px;padding:4px 16px 10px;flex:none}
.r-top h1{font-size:26px;font-weight:800}
.r-back{width:56px;height:56px;border-radius:14px;border:2px solid var(--r-line);background:transparent;color:var(--r-text);display:grid;place-items:center;flex:none}
.rbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:72px;border-radius:16px;border:0;background:var(--r-primary);color:var(--r-on-primary);font-weight:700;font-size:20px;text-decoration:none}
.rbtn.alt{background:transparent;color:var(--r-text);border:2px solid var(--r-line);min-height:60px;font-size:18px}
.rbtn.alert{background:var(--r-alert);color:var(--r-on-alert)}
.rbtn.go-online{background:var(--r-success);color:var(--r-on-success)}
.rbtn + .rbtn{margin-top:10px}
.r-bottom{position:absolute;left:0;right:0;bottom:84px;z-index:5;padding:12px 20px 14px;background:var(--r-bg);border-top:1px solid var(--r-soft)}
.r-bottom.no-tabs{bottom:0;padding-bottom:30px}
.r-tabs{position:absolute;left:0;right:0;bottom:0;height:84px;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);background:var(--r-bg);border-top:2px solid var(--r-line);padding-bottom:14px}
.r-tab{border:0;background:none;color:var(--r-muted);font-size:14px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.r-tab[aria-current="page"]{color:var(--r-text)}
.r-tab[aria-current="page"] span{border-bottom:3px solid var(--r-text)}
.banner{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:14px;background:#F2B544;color:#000;font-weight:700;font-size:18px;margin:6px 0 12px}
.state{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:14px;font-weight:700;margin:6px 0 12px}
.state.on{background:var(--r-success);color:var(--r-on-success)}
.state.off{background:var(--r-surface);color:var(--r-text);border:2px solid var(--r-line)}
.state.bad{background:var(--r-alert);color:var(--r-on-alert)}
.rcard{display:block;width:100%;text-align:left;background:var(--r-surface);color:var(--r-text);border:2px solid var(--r-line);border-radius:16px;padding:16px;margin:0 0 12px}
.rcard .no{font-family:var(--font-head);font-size:32px;font-weight:800;line-height:1}
.rcard .area{font-size:24px;font-weight:700;margin-top:6px}
.rcard .meta{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:8px;font-size:16px;color:var(--r-muted);font-weight:600}
.kv{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--r-soft);font-size:18px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--r-muted)}
.kv b{text-align:right}
.big{font-family:var(--font-head);font-weight:800;font-size:56px;line-height:1;letter-spacing:.02em}
.capbar{height:14px;border-radius:7px;background:var(--r-soft);overflow:hidden;margin:6px 0 4px}
.capbar i{display:block;height:100%;background:var(--r-text)}
.small{font-size:15px;color:var(--r-muted)}
.codebox{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.codebox span{height:76px;border:3px solid var(--r-line);border-radius:14px;display:grid;place-items:center;font-family:var(--font-head);font-size:40px;font-weight:800}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{min-height:64px;border-radius:14px;border:2px solid var(--r-line);background:var(--r-surface);color:var(--r-text);font-size:28px;font-weight:700}
.loc{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;padding:6px 12px;border-radius:999px;border:2px solid var(--r-line);margin-bottom:10px}
.loc i{width:10px;height:10px;border-radius:50%;background:var(--r-success)}
.segr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.segr button{min-height:56px;border-radius:12px;border:2px solid var(--r-line);background:transparent;color:var(--r-text);font-weight:700;font-size:16px}
.segr button[aria-pressed="true"]{background:var(--r-primary);color:var(--r-on-primary)}
.r-field{display:block;margin:14px 0}
.r-field span{display:block;font-weight:700;margin-bottom:6px}
.r-field input{width:100%;min-height:60px;border-radius:14px;border:2px solid var(--r-line);background:var(--r-bg);color:var(--r-text);padding:0 16px;font-size:18px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--r-soft)}
.switch{min-width:96px;min-height:52px;border-radius:12px;border:2px solid var(--r-line);background:transparent;color:var(--r-text);font-weight:700}
.switch[aria-pressed="true"]{background:var(--r-primary);color:var(--r-on-primary)}
.done-mark{width:110px;height:110px;border-radius:50%;background:var(--r-success);color:var(--r-on-success);display:grid;place-items:center;margin:24px auto 12px}
.err{padding:12px 14px;border-radius:12px;background:var(--r-alert);color:var(--r-on-alert);font-weight:700;margin:8px 0}

</style>
</head>

<script>
/* ---------- shared prototype engine ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const naira = n => "₦" + Math.round(n).toLocaleString("en-US");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const SCREENS = {};
let FLOWS = [];
let DEFAULT_SCREEN = null;
let lastScreen = null;
const ACT = {};
const INPUT = {};
let APP_NAME = "CKE prototype";
let renderDemo = () => "";

function screen(id, cfg) { SCREENS[id] = cfg; }
function current() { const h = location.hash.slice(1); return SCREENS[h] ? h : DEFAULT_SCREEN; }
function go(id) {
  if (!SCREENS[id]) return;
  if (location.hash.slice(1) === id) { enterAndRender(id); } else { location.hash = id; }
}
function enterAndRender(id) {
  const sc = SCREENS[id];
  if (sc && sc.enter && lastScreen !== id) sc.enter();
  render();
}
function render() {
  const id = current();
  const sc = SCREENS[id];
  const app = $("#app");
  const scrollEl = app.querySelector(".scroll");
  const keep = id === lastScreen && scrollEl ? scrollEl.scrollTop : 0;
  app.innerHTML = sc.render();
  const ns = app.querySelector(".scroll");
  if (ns) ns.scrollTop = keep;
  lastScreen = id;
  $$("[data-nav]").forEach(a => a.setAttribute("aria-current", a.dataset.nav === id ? "page" : "false"));
  $("#note-title").textContent = sc.title;
  $("#note-body").innerHTML = sc.note || "";
  $("#note-ids").innerHTML = (sc.ids || []).map(x => `<li>${x}</li>`).join("") || "<li>Supporting screen</li>";
  const nxt = nextInFlow(id);
  $("#note-next").innerHTML = nxt ? `<button class="next-btn" data-go="${nxt}">Next in this flow: ${esc(SCREENS[nxt].title)}</button>` : "";
  $("#demo").innerHTML = renderDemo();
  document.title = sc.title + " – " + APP_NAME;
  if (sc.after) sc.after(app);
}
function nextInFlow(id) {
  for (const f of FLOWS) {
    const i = f.screens.indexOf(id);
    if (i > -1 && i < f.screens.length - 1) return f.screens[i + 1];
  }
  return null;
}
function buildFlows() {
  $("#flowlist").innerHTML = FLOWS.map(f => `
    <div class="flow"><h2>${esc(f.name)}</h2>
      <ol>${f.screens.map(s => `<li><a href="#${s}" data-nav="${s}">${esc(SCREENS[s].title)}</a></li>`).join("")}</ol>
    </div>`).join("");
}
function toast(msg) {
  const scr = $("#app");
  const t = document.createElement("div");
  t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  scr.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
function fit() {
  const dev = $(".device"); const wrap = $(".device-wrap"); const stage = $(".stage");
  if (!dev || !wrap || !stage) return;
  const dw = dev.offsetWidth, dh = dev.offsetHeight;
  const sw = stage.clientWidth - 24;
  const top = stage.getBoundingClientRect().top;
  const narrow = window.innerWidth <= 820;
  const vh = window.innerHeight - Math.max(top, 64) - 30;
  let s = Math.min(1, sw / dw, narrow ? 1 : Math.max(vh, 520) / dh);
  s = Math.max(s, 0.3);
  dev.style.transform = `scale(${s})`;
  wrap.style.width = dw * s + "px";
  wrap.style.height = dh * s + "px";
}
function chromeTheme(mode) {
  const r = document.documentElement;
  if (mode === "auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", mode);
  try { localStorage.setItem("cke-proto-theme", mode); } catch (e) {}
}
function seg(name, options, value, act) {
  return `<div class="demo-row"><span>${name}</span><div class="seg">${options.map(([v, label]) =>
    `<button data-act="${act}" data-v="${v}" aria-pressed="${v === value}">${label}</button>`).join("")}</div></div>`;
}
function boot(defaultId, appName) {
  DEFAULT_SCREEN = defaultId; APP_NAME = appName;
  buildFlows();
  let saved = "auto";
  try { saved = localStorage.getItem("cke-proto-theme") || "auto"; } catch (e) {}
  chromeTheme(saved);
  document.addEventListener("click", e => {
    const g = e.target.closest("[data-go]");
    if (g) { e.preventDefault(); go(g.dataset.go); return; }
    const a = e.target.closest("[data-act]");
    if (a && ACT[a.dataset.act]) {
      e.preventDefault();
      const r = ACT[a.dataset.act](a.dataset, a, e);
      if (r !== false) render();
    }
    const t = e.target.closest("[data-chrome-theme]");
    if (t) { const order = ["auto", "light", "dark"]; let cur = "auto"; try { cur = localStorage.getItem("cke-proto-theme") || "auto"; } catch (er) {} const nx = order[(order.indexOf(cur) + 1) % 3]; chromeTheme(nx); t.textContent = "Page theme: " + ({ auto: "follow device", light: "light", dark: "dark" }[nx]); }
  });
  document.addEventListener("keydown", e => {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-act]:not(button):not(input):not(select):not(textarea)")) { e.preventDefault(); e.target.click(); }
  });
  const onField = e => { const a = e.target.closest("[data-input]"); if (a && INPUT[a.dataset.input]) INPUT[a.dataset.input](a, e); };
  document.addEventListener("input", onField);
  document.addEventListener("change", onField);
  window.addEventListener("hashchange", () => enterAndRender(current()));
  window.addEventListener("resize", fit);
  const startId = current();
  if (SCREENS[startId].enter) SCREENS[startId].enter();
  render();
  fit();
  setTimeout(fit, 300);
  const tb = $("[data-chrome-theme]");
  if (tb) tb.textContent = "Page theme: " + ({ auto: "follow device", light: "light", dark: "dark" }[saved] || "follow device");
}

  savePass: () => { R.firstTime = false; toast("Password saved"); go("r-home"); return false; },
  toggleOnline: () => { R.online = !R.online; toast(R.online ? "You’re online" : "You’re offline"); },
  pick: d => { R.sel = d.no; R.newBanner = false; go("r-order"); return false; },
  accept: () => { if (R.raceLost) { go("r-taken"); return false; } const o = sel(); if (fits(o)) R.carrying.push(o); R.stage = "pickup"; toast(o.no + " accepted"); go("r-active"); return false; },
  pickedUp: () => { R.stage = "deliver"; toast("Picked up"); go("r-deliver"); return false; },
  navigate: () => { toast("Opens your navigation app with the address"); return false; },
  call: () => { toast("Calls the customer"); return false; },
  key: d => {
    if (d.v === "Clear") R.code = ""; else if (d.v === "Delete") R.code = R.code.slice(0, -1); else if (R.code.length < 4) R.code += d.v;
    if (R.code.length === 4) { if (R.code === "4827") { R.carrying.shift(); R.today++; R.tries = 0; R.stage = "pickup"; go("r-done"); return false; } R.tries++; R.code = ""; }
  },
  help: () => { R.helpSent = true; },
  helpDone: () => { R.helpSent = false; go("r-deliver"); return false; },
  release: () => { R.carrying.shift(); toast("Order released to the queue"); go("r-queue"); return false; },
  earn: d => { R.earnTab = d.v; },
  theme: d => { R.modePref = d.v; R.mode = d.v === "dark" ? "dark" : "light"; },
  sound: () => { R.sound = !R.sound; },
  vibrate: () => { R.vibrate = !R.vibrate; },
  signOut: () => { R.signedIn = false; go("r-signin"); return false; },
  dTheme: d => { R.mode = d.v; R.modePref = d.v; },
  dOnline: d => { R.online = d.v === "on"; },
  dRace: d => { R.raceLost = d.v === "on"; },
  dCarry: d => { R.carrying = d.v === "two" ? [QUEUE[0], QUEUE[1]] : d.v === "one" ? [QUEUE[0]] : []; R.online = true; },
  dPay: d => { R.pay = Number(d.v); toast("Pay per delivery is now " + naira(R.pay)); },
  dReset: () => { rReset(); go("r-signin"); return false; }
});
renderDemo = () => seg("Theme", [["light", "Light"], ["dark", "Dark"]], R.mode, "dTheme")
  + seg("Status", [["off", "Offline"], ["on", "Online"]], R.online ? "on" : "off", "dOnline")
  + seg("Carrying", [["none", "Nothing"], ["one", "One order"], ["two", "Two orders"]], R.carrying.length === 2 ? "two" : R.carrying.length === 1 ? "one" : "none", "dCarry")
  + seg("Pay per delivery (set by the manager)", [["1000", "₦1,000"], ["1200", "₦1,200"]], String(R.pay), "dPay")
  + seg("When accepting", [["off", "This rider wins"], ["on", "Another rider wins"]], R.raceLost ? "on" : "off", "dRace")
  + `<button class="wide" data-act="dReset">Reset the prototype</button>`;
FLOWS = [
  { name: "Start of shift", screens: ["r-signin", "r-newpass", "r-home"] },
  { name: "Take and deliver an order", screens: ["r-queue", "r-order", "r-active", "r-pickup", "r-deliver", "r-code", "r-done"] },
  { name: "Problems", screens: ["r-taken", "r-help", "r-release"] },
  { name: "Money and account", screens: ["r-earnings", "r-me", "r-prefs"] }
];
if (window.innerWidth <= 820) { const d = document.getElementById("flows-d"); if (d) d.open = false; }
boot("r-signin", "CKE rider app prototype");

</script>
</body>
</html>
