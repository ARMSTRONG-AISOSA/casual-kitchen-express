<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CKE customer app prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#C83F2D;--red-deep:#A32A1B;--red-light:#E4604C;--yellow:#F2B544;--cream:#FFF3DF;--char:#292522;
  --kraft:#E2C9A3;--kraft-shade:#CDAE84;--muted:#5B534E;--border:#D9CDB8;--white:#FFFFFF;--black:#000000;
  --green:#1B7A3A;--green-light:#5CC47E;
  --chrome-bg:#E6E0D6;--chrome-panel:#F7F4EF;--chrome-text:#292522;--chrome-muted:#5B534E;--chrome-line:#D3CABD;
  --chrome-accent:#A32A1B;--chrome-chip:#EDE6DA;--chrome-chip-on:#292522;--chrome-chip-on-text:#FFF3DF;--bezel:#1C1917;
  --font-head:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --chrome-bg:#141110;--chrome-panel:#1F1B19;--chrome-text:#FFF3DF;--chrome-muted:#CFC4B5;--chrome-line:#3A332E;
    --chrome-accent:#E4604C;--chrome-chip:#2A2522;--chrome-chip-on:#FFF3DF;--chrome-chip-on-text:#292522;--bezel:#000000;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --chrome-bg:#141110;--chrome-panel:#1F1B19;--chrome-text:#FFF3DF;--chrome-muted:#CFC4B5;--chrome-line:#3A332E;
  --chrome-accent:#E4604C;--chrome-chip:#2A2522;--chrome-chip-on:#FFF3DF;--chrome-chip-on-text:#292522;--bezel:#000000;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--chrome-bg);color:var(--chrome-text);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--chrome-accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- prototype chrome ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--chrome-panel)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--chrome-panel);border-bottom:1px solid var(--chrome-line)}
.topbar .mark{width:44px;height:34px;flex:none}
.topbar h1{font-family:var(--font-head);font-weight:800;font-size:19px;line-height:1.15;margin:0}
.topbar p{margin:0;font-size:13px;color:var(--chrome-muted)}
.topbar .grow{flex:1 1 auto;min-width:0}
.proto-links{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.proto-links a,.chrome-btn{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--chrome-line);background:transparent;text-decoration:none;font-size:13px;font-weight:600;color:var(--chrome-text)}
.proto-links a[aria-current="page"]{background:var(--chrome-chip-on);color:var(--chrome-chip-on-text);border-color:var(--chrome-chip-on)}
.shell{display:grid;grid-template-columns:272px minmax(0,1fr) 300px;align-items:start}
.flows,.notes{position:sticky;top:64px;max-height:calc(100vh - 64px);overflow:auto;padding:18px 16px 40px}
.flows summary{font-family:var(--font-head);font-weight:800;font-size:16px;cursor:pointer;list-style:none;margin-bottom:6px}
.flows summary::-webkit-details-marker{display:none}
.flow{margin:14px 0 4px}
.flow h2{font-family:var(--font-head);font-weight:800;font-size:14px;margin:0 0 4px;color:var(--chrome-text)}
.flow ol{margin:0;padding:0 0 0 22px;color:var(--chrome-muted);font-size:13.5px}
.flow li{margin:1px 0}
.flow a{display:block;padding:4px 8px;margin-left:-8px;border-radius:8px;text-decoration:none;color:var(--chrome-text)}
.flow a:hover{background:var(--chrome-chip)}
.flow a[aria-current="page"]{background:var(--chrome-chip-on);color:var(--chrome-chip-on-text);font-weight:600}
.stage{padding:22px 12px 40px;display:flex;justify-content:center;min-width:0}
.device-wrap{position:relative;flex:none}
.device{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--bezel);border-radius:52px;padding:12px;box-shadow:0 40px 60px -40px rgba(0,0,0,.55)}
.device.phone{width:414px;height:868px}
.device.tablet{width:1208px;height:848px;border-radius:30px;padding:14px}
.scr{position:relative;width:100%;height:100%;overflow:hidden;border-radius:40px;background:#fff;isolation:isolate}
.device.tablet .scr{border-radius:18px}
.notes h2{font-family:var(--font-head);font-weight:800;font-size:17px;line-height:1.25;margin:0 0 6px}
.notes h3{font-size:13px;font-weight:700;margin:14px 0 4px;color:var(--chrome-muted)}
.notes p{margin:0 0 8px;font-size:14px}
.note,.demo{background:var(--chrome-panel);border:1px solid var(--chrome-line);border-radius:14px;padding:14px 14px 12px;margin-bottom:14px}
.ids{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.ids li{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--chrome-chip);color:var(--chrome-text)}
.next-btn{margin-top:12px;width:100%;min-height:40px;border-radius:10px;border:0;background:var(--chrome-chip-on);color:var(--chrome-chip-on-text);font-weight:600}
.demo-row{margin:10px 0}
.demo-row > span{display:block;font-size:12.5px;font-weight:600;color:var(--chrome-muted);margin-bottom:4px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{min-height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--chrome-line);background:transparent;font-size:13px;color:var(--chrome-text)}
.seg button[aria-pressed="true"]{background:var(--chrome-chip-on);color:var(--chrome-chip-on-text);border-color:var(--chrome-chip-on)}
.demo .wide{width:100%;min-height:36px;border-radius:9px;border:1px solid var(--chrome-line);background:transparent;margin-top:4px;font-size:13px;font-weight:600;color:var(--chrome-text)}

@media (max-width:1180px){
  .shell{grid-template-columns:240px minmax(0,1fr)}
  .notes{grid-column:1 / -1;position:static;max-height:none;display:grid;grid-template-columns:1fr 1fr;gap:14px}
}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .flows{position:static;max-height:none;padding-bottom:4px}
  .flows details:not([open]){margin-bottom:0}
  .notes{grid-template-columns:1fr}
  .topbar{flex-wrap:wrap}
  .proto-links{justify-content:flex-start}
}

/* ---------- inside-app shared bits ---------- */
.statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 32px;font-size:14px;font-weight:600;flex:none}
.statusbar svg{display:block}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);z-index:50;max-width:86%;padding:10px 16px;border-radius:12px;background:#292522;color:#FFF3DF;font-size:14px;font-weight:500;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);animation:toastIn .25s ease-out}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.photo-ph{position:relative;display:flex;align-items:flex-end;justify-content:flex-start;overflow:hidden;background:linear-gradient(135deg,#E8D3B2,#D9BA8E);color:#5B3F23}
.photo-ph svg.dish{position:absolute;right:-6%;top:50%;transform:translateY(-50%);width:62%;height:auto;opacity:.9}
.photo-ph .ph-note{position:relative;margin:8px;padding:2px 8px;border-radius:6px;background:rgba(255,243,223,.85);font-size:11px;font-weight:600;color:#5B3F23}

.capp{--a-bg:#FFF3DF;--a-surface:#FFFFFF;--a-text:#292522;--a-muted:#5B534E;--a-line:#E8DCC8;--a-primary:#C83F2D;--a-on-primary:#FFF3DF;--a-accent:#C83F2D;--a-chip:#F5E7CF;--a-bar:#292522;--a-on-bar:#FFF3DF;--a-success:#1B7A3A;
  position:absolute;inset:0;display:flex;flex-direction:column;background:var(--a-bg);color:var(--a-text);font-family:var(--font-body);font-size:15px;line-height:1.45}
.capp[data-mode="dark"]{--a-bg:#1F1B19;--a-surface:#2A2522;--a-text:#FFF3DF;--a-muted:#CFC4B5;--a-line:#3A332E;--a-primary:#FFF3DF;--a-on-primary:#292522;--a-accent:#E4604C;--a-chip:#332C28;--a-bar:#FFF3DF;--a-on-bar:#292522;--a-success:#5CC47E}
.capp :focus-visible{outline:3px solid var(--a-accent);outline-offset:2px}
.capp h1,.capp h2,.capp h3{font-family:var(--font-head);margin:0;line-height:1.15}
.capp .scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:0 18px 150px;scrollbar-width:thin}
.capp .scroll.short{padding-bottom:120px}
.c-head{display:flex;align-items:center;justify-content:space-between;padding:2px 0 6px}
.c-open{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--a-chip)}
.c-open i{width:8px;height:8px;border-radius:50%;background:var(--a-success)}
.c-open.closed i{background:var(--a-accent)}
.c-hero{position:relative;margin:6px 0 4px;padding:16px 16px 18px;border-radius:20px;background:#292522;color:#FFF3DF;overflow:hidden}
.capp[data-mode="dark"] .c-hero{background:#332C28}
.c-hero h1{font-size:28px;font-weight:800;letter-spacing:-.01em;max-width:250px}
.c-hero p{margin:6px 0 0;font-size:13.5px;color:#E9DCC4;max-width:240px}
.c-hero .hero-pot{position:absolute;right:-18px;bottom:-14px;width:150px;height:114px;opacity:.95}
.c-hero .lines{position:absolute;right:120px;bottom:30px;display:flex;flex-direction:column;gap:7px}
.c-hero .lines i{display:block;height:5px;border-radius:3px;background:#F2B544}
.c-search{display:flex;align-items:center;gap:8px;margin:14px 0 2px;padding:0 14px;min-height:48px;border-radius:14px;background:var(--a-surface);border:1.5px solid var(--a-line)}
.c-search input{flex:1;border:0;background:transparent;min-height:44px;outline:none;color:var(--a-text)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 18px 4px;margin:0 -18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--a-line);background:var(--a-surface);font-size:13.5px;font-weight:600;color:var(--a-text)}
.chip[aria-pressed="true"]{background:var(--a-text);color:var(--a-bg);border-color:var(--a-text)}
.sec-title{font-size:20px;font-weight:800;margin:18px 0 8px}
.mcard{display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px;background:var(--a-surface);border-radius:18px;padding:10px;margin-bottom:10px;border:1px solid var(--a-line);text-align:left;width:100%;color:var(--a-text)}
.mcard .photo-ph{border-radius:12px}
.mcard h3{font-size:17px;font-weight:700}
.mcard p{margin:3px 0 8px;font-size:13px;color:var(--a-muted);line-height:1.35}
.mcard .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.price{font-weight:700;font-size:15px}
.add{width:44px;height:44px;flex:none;border-radius:13px;border:0;background:var(--a-primary);color:var(--a-on-primary);display:grid;place-items:center}
.mcard.sold .photo-ph{filter:grayscale(.8);opacity:.7}
.sold-tag{font-size:12.5px;font-weight:700;color:var(--a-accent)}
.reorder{display:flex;align-items:center;gap:12px;margin:12px 0 0;padding:14px;border-radius:18px;background:#E2C9A3;color:#292522}
.reorder h2{font-size:17px;font-weight:800}
.reorder p{margin:2px 0 0;font-size:13px}
.reorder .btn{width:auto;min-height:44px;padding:0 16px;flex:none;background:#292522;color:#FFF3DF}
.orderbar{position:absolute;left:12px;right:12px;bottom:90px;z-index:6;display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:58px;border-radius:18px;background:var(--a-bar);color:var(--a-on-bar);border:0;text-align:left;box-shadow:0 14px 30px -14px rgba(0,0,0,.6)}
.orderbar .grow{flex:1}
.orderbar b{font-size:16px}
.speed{display:inline-flex;flex-direction:column;gap:3px;flex:none}
.speed i{display:block;height:3px;border-radius:2px;background:#F2B544}
.tabs{position:absolute;left:0;right:0;bottom:0;height:82px;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);background:var(--a-surface);border-top:1px solid var(--a-line);padding-bottom:16px}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--a-muted)}
.tab[aria-current="page"]{color:var(--a-text)}
.tab[aria-current="page"] svg{color:var(--a-accent)}
.topnav{display:flex;align-items:center;gap:10px;padding:2px 14px 8px;flex:none}
.back{width:44px;height:44px;border-radius:13px;border:0;background:var(--a-chip);display:grid;place-items:center;color:var(--a-text)}
.topnav h1{font-size:20px;font-weight:800}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:15px;border:0;background:var(--a-primary);color:var(--a-on-primary);font-weight:600;font-size:16px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--a-text);border:1.5px solid var(--a-line)}
.btn.small{min-height:44px;font-size:14.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.footer-cta{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:14px 18px 28px;background:linear-gradient(to top,var(--a-bg) 72%,rgba(0,0,0,0))}
.footer-cta .hint{font-size:12.5px;color:var(--a-muted);text-align:center;margin:0 0 8px}
.card{background:var(--a-surface);border:1px solid var(--a-line);border-radius:18px;padding:14px;margin:10px 0}
.card h2{font-size:17px;font-weight:800;margin-bottom:6px}
.field{display:block;margin:10px 0}
.field > span{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.field input,.field select{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--a-line);background:var(--a-surface);padding:0 12px;color:var(--a-text)}
.field em{font-style:normal;font-weight:500;color:var(--a-muted)}
.segc{display:grid;grid-template-columns:1fr 1fr;background:var(--a-chip);border-radius:14px;padding:4px;gap:4px}
.segc button{min-height:42px;border:0;border-radius:10px;background:transparent;font-weight:600;color:var(--a-muted)}
.segc button[aria-pressed="true"]{background:var(--a-surface);color:var(--a-text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.line{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14.5px}
.line.total{font-weight:700;font-size:17px;border-top:1px solid var(--a-line);margin-top:6px;padding-top:10px}
.demo-note{display:flex;gap:8px;align-items:center;font-size:13px;padding:10px 12px;border-radius:12px;background:#F2B544;color:#292522;font-weight:600;margin:10px 0}
.timeline{list-style:none;margin:8px 0 0;padding:0}
.timeline li{position:relative;padding:0 0 14px 32px;font-size:14.5px;color:var(--a-muted)}
.timeline li::before{content:"";position:absolute;left:6px;top:5px;width:14px;height:14px;border-radius:50%;border:2px solid var(--a-line);background:var(--a-bg)}
.timeline li::after{content:"";position:absolute;left:12px;top:22px;bottom:0;width:2px;background:var(--a-line)}
.timeline li:last-child::after{display:none}
.timeline li.done{color:var(--a-text)}
.timeline li.done::before{background:var(--a-success);border-color:var(--a-success)}
.timeline li.now{color:var(--a-text);font-weight:700}
.timeline li.now::before{background:var(--a-accent);border-color:var(--a-accent);box-shadow:0 0 0 5px rgba(200,63,45,.22)}
.timeline small{display:block;font-weight:400;color:var(--a-muted);font-size:12.5px}
.code{background:#F2B544;color:#292522;border-radius:18px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.code b{font-family:var(--font-head);font-size:38px;font-weight:800;letter-spacing:.18em;line-height:1}
.code span{font-size:13px;font-weight:600;max-width:140px}
.map{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--a-line);background:#F6EBD7}
.map svg{display:block;width:100%;height:auto}
.map .credit{position:absolute;right:6px;bottom:5px;font-size:9.5px;background:rgba(255,255,255,.85);color:#292522;padding:1px 5px;border-radius:4px}
.map.pickable svg{cursor:crosshair}
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.38);z-index:20;border:0}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--a-surface);border-radius:24px 24px 0 0;padding:20px 18px 30px;animation:sheetIn .22s ease-out}
.sheet h2{font-size:20px;font-weight:800;margin-bottom:6px}
.sheet p{margin:0 0 12px;color:var(--a-muted);font-size:14px}
.sheet .btn + .btn{margin-top:8px}
@keyframes sheetIn{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.avatar{width:76px;height:76px;border-radius:50%;background:#C83F2D;color:#FFF3DF;display:grid;place-items:center;font-family:var(--font-head);font-weight:800;font-size:28px;flex:none;overflow:hidden}
.stars{display:flex;gap:4px;justify-content:center;margin:8px 0 12px}
.stars button{width:52px;height:52px;border:0;background:none;color:var(--a-line);display:grid;place-items:center}
.stars button[aria-pressed="true"]{color:#F2B544}
.list-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--a-line)}
.list-row:last-child{border-bottom:0}
.list-row small{display:block;color:var(--a-muted);font-size:12.5px}
.qty{display:inline-flex;align-items:center;gap:10px;font-weight:700}
.qty button{width:36px;height:36px;border-radius:11px;border:1.5px solid var(--a-line);background:var(--a-surface);font-size:18px;line-height:1;color:var(--a-text);display:grid;place-items:center}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:50px;padding:0 14px;border:1.5px solid var(--a-line);border-radius:13px;margin:6px 0;background:var(--a-surface);color:var(--a-text);font-weight:500;text-align:left}
.opt[aria-pressed="true"]{border-color:var(--a-text);box-shadow:inset 0 0 0 1px var(--a-text);font-weight:700}
.opt[disabled]{opacity:.5;cursor:not-allowed}
.opt-group h2{font-size:16px;font-weight:800;margin:16px 0 2px}
.opt-group p{margin:0 0 4px;font-size:12.5px;color:var(--a-muted)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;border-radius:15px;background:#FFFFFF;color:#1F1F1F;border:1.5px solid #747775;font-weight:600;font-size:15.5px}
.warn{background:rgba(200,63,45,.12);color:var(--a-text);border-left:4px solid var(--a-accent);padding:10px 12px;border-radius:10px;font-size:14px;margin:10px 0}
.ok{background:rgba(27,122,58,.12);color:var(--a-text);border-left:4px solid var(--a-success);padding:10px 12px;border-radius:10px;font-size:14px;margin:10px 0}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--a-chip);color:var(--a-text)}
.big-check{width:96px;height:96px;border-radius:50%;background:#1B7A3A;color:#fff;display:grid;place-items:center;margin:30px auto 14px;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.steam-burst{display:flex;justify-content:center;gap:12px;margin-top:-6px}
.steam-burst i{display:block;width:5px;height:22px;border-radius:3px;background:#F2B544;animation:rise 1.2s ease-out both}
.steam-burst i:nth-child(2){animation-delay:.12s}.steam-burst i:nth-child(3){animation-delay:.24s}
@keyframes rise{from{transform:translateY(10px);opacity:0}50%{opacity:1}to{transform:translateY(-14px);opacity:0}}
.center{text-align:center}
.muted{color:var(--a-muted)}
.tag-label{display:flex;gap:8px;flex-wrap:wrap}
.sheet{max-height:90%;overflow-y:auto}
.check{display:flex;gap:10px;align-items:flex-start;margin:12px 0 8px;font-size:14.5px;line-height:1.4}
.check input{width:22px;height:22px;margin:1px 0 0;accent-color:#C83F2D;flex:none}
.linkbtn{display:block;width:100%;min-height:44px;border:0;background:none;color:var(--a-muted);text-decoration:underline;text-underline-offset:3px;font-weight:600;font-size:14.5px;margin-top:6px}
.linkbtn.inline{display:inline;width:auto;min-height:0;margin:0;padding:0;color:var(--a-text)}
.danger{border:2px solid #A32A1B;border-radius:18px;padding:14px;margin:12px 0;background:rgba(163,42,27,.06)}
.capp[data-mode="dark"] .danger{border-color:#E4604C;background:rgba(228,96,76,.1)}
.danger h2{color:var(--a-accent);font-size:17px;font-weight:800;margin-bottom:4px}
.danger p{font-size:14px;margin:0 0 10px}
.danger-btn{background:#A32A1B;color:#FFFFFF}
.capp[data-mode="dark"] .danger-btn{background:#E4604C;color:#000000}
.rowbtn{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:58px;background:none;border:0;border-bottom:1px solid var(--a-line);color:var(--a-text);text-align:left;font-size:15.5px;font-weight:600;padding:0 2px}
.rowbtn:last-child{border-bottom:0}
.prose h2{font-size:18px;font-weight:800;margin:18px 0 4px}
.prose p,.prose li{font-size:14.5px}
.prose ul{padding-left:20px}

</style>
</head>

<script>
/* ---------- shared prototype engine ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const naira = n => "₦" + Math.round(n).toLocaleString("en-US");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const SCREENS = {};
let FLOWS = [];
let DEFAULT_SCREEN = null;
let lastScreen = null;
const ACT = {};
const INPUT = {};
let APP_NAME = "CKE prototype";
let renderDemo = () => "";

function screen(id, cfg) { SCREENS[id] = cfg; }
function current() { const h = location.hash.slice(1); return SCREENS[h] ? h : DEFAULT_SCREEN; }
function go(id) {
  if (!SCREENS[id]) return;
  if (location.hash.slice(1) === id) { enterAndRender(id); } else { location.hash = id; }
}
function enterAndRender(id) {
  const sc = SCREENS[id];
  if (sc && sc.enter && lastScreen !== id) sc.enter();
  render();
}
function render() {
  const id = current();
  const sc = SCREENS[id];
  const app = $("#app");
  const scrollEl = app.querySelector(".scroll");
  const keep = id === lastScreen && scrollEl ? scrollEl.scrollTop : 0;
  app.innerHTML = sc.render();
  const ns = app.querySelector(".scroll");
  if (ns) ns.scrollTop = keep;
  lastScreen = id;
  $$("[data-nav]").forEach(a => a.setAttribute("aria-current", a.dataset.nav === id ? "page" : "false"));
  $("#note-title").textContent = sc.title;
  $("#note-body").innerHTML = sc.note || "";
  $("#note-ids").innerHTML = (sc.ids || []).map(x => `<li>${x}</li>`).join("") || "<li>Supporting screen</li>";
  const nxt = nextInFlow(id);
  $("#note-next").innerHTML = nxt ? `<button class="next-btn" data-go="${nxt}">Next in this flow: ${esc(SCREENS[nxt].title)}</button>` : "";
  $("#demo").innerHTML = renderDemo();
  document.title = sc.title + " – " + APP_NAME;
  if (sc.after) sc.after(app);
}
function nextInFlow(id) {
  for (const f of FLOWS) {
    const i = f.screens.indexOf(id);
    if (i > -1 && i < f.screens.length - 1) return f.screens[i + 1];
  }
  return null;
}
function buildFlows() {
  $("#flowlist").innerHTML = FLOWS.map(f => `
    <div class="flow"><h2>${esc(f.name)}</h2>
      <ol>${f.screens.map(s => `<li><a href="#${s}" data-nav="${s}">${esc(SCREENS[s].title)}</a></li>`).join("")}</ol>
    </div>`).join("");
}
function toast(msg) {
  const scr = $("#app");
  const t = document.createElement("div");
  t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  scr.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
function fit() {
  const dev = $(".device"); const wrap = $(".device-wrap"); const stage = $(".stage");
  if (!dev || !wrap || !stage) return;
  const dw = dev.offsetWidth, dh = dev.offsetHeight;
  const sw = stage.clientWidth - 24;
  const top = stage.getBoundingClientRect().top;
  const narrow = window.innerWidth <= 820;
  const vh = window.innerHeight - Math.max(top, 64) - 30;
  let s = Math.min(1, sw / dw, narrow ? 1 : Math.max(vh, 520) / dh);
  s = Math.max(s, 0.3);
  dev.style.transform = `scale(${s})`;
  wrap.style.width = dw * s + "px";
  wrap.style.height = dh * s + "px";
}
function chromeTheme(mode) {
  const r = document.documentElement;
  if (mode === "auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", mode);
  try { localStorage.setItem("cke-proto-theme", mode); } catch (e) {}
}
function seg(name, options, value, act) {
  return `<div class="demo-row"><span>${name}</span><div class="seg">${options.map(([v, label]) =>
    `<button data-act="${act}" data-v="${v}" aria-pressed="${v === value}">${label}</button>`).join("")}</div></div>`;
}
function boot(defaultId, appName) {
  DEFAULT_SCREEN = defaultId; APP_NAME = appName;
  buildFlows();
  let saved = "auto";
  try { saved = localStorage.getItem("cke-proto-theme") || "auto"; } catch (e) {}
  chromeTheme(saved);
  document.addEventListener("click", e => {
    const g = e.target.closest("[data-go]");
    if (g) { e.preventDefault(); go(g.dataset.go); return; }
    const a = e.target.closest("[data-act]");
    if (a && ACT[a.dataset.act]) {
      e.preventDefault();
      const r = ACT[a.dataset.act](a.dataset, a, e);
      if (r !== false) render();
    }
    const t = e.target.closest("[data-chrome-theme]");
    if (t) { const order = ["auto", "light", "dark"]; let cur = "auto"; try { cur = localStorage.getItem("cke-proto-theme") || "auto"; } catch (er) {} const nx = order[(order.indexOf(cur) + 1) % 3]; chromeTheme(nx); t.textContent = "Page theme: " + ({ auto: "follow device", light: "light", dark: "dark" }[nx]); }
  });
  document.addEventListener("keydown", e => {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-act]:not(button):not(input):not(select):not(textarea)")) { e.preventDefault(); e.target.click(); }
  });
  const onField = e => { const a = e.target.closest("[data-input]"); if (a && INPUT[a.dataset.input]) INPUT[a.dataset.input](a, e); };

      ${done && !o.cancelled ? `<button class="btn" data-go="c-rate">Rate your order</button>` : ""}

      <div class="card"><label class="field" style="margin-top:0"><span>Name</span><input data-input="name" value="${esc(S.name)}"></label>
      <label class="field"><span>Gender <em>(optional)</em></span><select data-input="gender"><option value="">Choose</option>${["Female", "Male", "Prefer not to say"].map(g => `<option ${S.gender === g ? "selected" : ""}>${g}</option>`).join("")}</select></label></div>
      <div class="card"><h2>Addresses</h2>${S.hasAddress ? `<div class="list-row"><div><b>${esc(S.address.label)}, ${esc(S.address.area)}</b><small>${esc(S.address.landmark)}</small><small>Default</small></div><button class="btn ghost small" style="width:auto;padding:0 14px" data-act="editAddress">Edit</button></div>` : `<p class="muted" style="margin:0 0 8px">No saved addresses yet.</p>`}<button class="btn ghost small" data-act="editAddress">Add address</button></div>
      ${prefsCard()}${helpCard()}
      <div class="card"><h2>Account</h2><p class="muted" style="margin:0 0 10px;font-size:14px">Take a break without losing anything. Come back any time by signing in again.</p><button class="btn ghost small" data-act="openDeactivate">Deactivate my account</button></div>
      <section class="danger" aria-labelledby="dz"><h2 id="dz">Danger zone</h2><p>Deleting your account removes your details for good. This can’t be undone.</p><button class="btn danger-btn small" data-act="openDelete">Delete my account</button></section>
    </div>`, { tabs: "c-profile" });
  }
});
function prefsCard() { return `<div class="card"><h2>Theme</h2><div class="segc" style="grid-template-columns:1fr 1fr 1fr">${[["light", "Light"], ["dark", "Dark"], ["system", "Follow phone"]].map(([v, l]) => `<button data-act="appMode" data-v="${v}" aria-pressed="${(S.modePref || "light") === v}">${l}</button>`).join("")}</div></div>`; }
function helpCard() { return `<div class="card"><h2>Help</h2><p class="muted" style="margin:0 0 10px;font-size:14px">Questions about an order? Message the restaurant on WhatsApp.</p><a class="btn ghost small" href="https://wa.me/2349095466063" target="_blank" rel="noopener">${IC.chat}Contact the restaurant</a></div>`; }
screen("c-deactivate", {
  title: "Deactivate account", ids: ["CUS-25"],
  note: "<p>Deactivating hides the account and signs the customer out, without deleting anything. Signing in again with Google offers to reactivate it.</p>",
  render() {
    return shell(`${topnav("Deactivate account", "c-profile")}<div class="scroll short"><h1 style="font-size:24px;margin:10px 0 6px">Take a break?</h1>
      <p class="muted" style="margin-bottom:4px">When you deactivate your account, we:</p><ul class="muted" style="padding-left:20px;font-size:14.5px;margin-top:4px"><li>sign you out on this phone</li><li>keep your addresses, orders, and saved demo card</li><li>stop order updates and messages</li></ul>
      <p class="muted">To come back, sign in with Google and confirm that you want to reactivate.</p>
      ${S.order && !S.order.cancelled && S.order.stage < 8 ? `<div class="warn">You have an order in progress. Wait until it’s delivered before you deactivate.</div>` : ""}
      <label class="check"><input type="checkbox" data-input="deAgree" ${S.deAgree ? "checked" : ""}><span>I want to deactivate my account.</span></label></div>
      <div class="footer-cta"><button class="btn" data-act="deactivate" ${S.deAgree ? "" : "disabled"}>Deactivate my account</button><button class="btn ghost" style="margin-top:8px" data-go="c-profile">Keep it active</button></div>`);
  }
});
screen("c-delete", {
  title: "Delete account", ids: ["CUS-17"],
  note: "<p>High friction on purpose: a danger-zone warning, a checkbox, and typing DELETE ACCOUNT exactly before the button works. Deactivating is offered as the gentler choice.</p>",
  render() {
    const ok = S.delAgree && S.delText === "DELETE ACCOUNT";
    return shell(`${topnav("Delete account", "c-profile")}<div class="scroll short">
      <section class="danger"><h2>Danger zone</h2><p style="margin:0">Deleting your account is permanent.</p></section>
      <p>This removes your name, email, addresses, photo, and saved demo card. Past orders stay in our records without your details. It can’t be undone.</p>
      <div class="ok">Want a break instead? <button class="linkbtn inline" data-act="openDeactivate">Deactivate your account</button></div>
      ${S.order && !S.order.cancelled && S.order.stage < 8 ? `<div class="warn">You have an order in progress. Wait until it’s delivered.</div>` : ""}
      <label class="check"><input type="checkbox" data-input="delAgree" ${S.delAgree ? "checked" : ""}><span>I understand my account will be deleted for good.</span></label>
      <label class="field"><span>Type DELETE ACCOUNT to confirm</span><input data-input="delText" value="${esc(S.delText)}" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>
      ${S.delText && S.delText !== "DELETE ACCOUNT" ? `<p class="muted" style="font-size:13px;margin:0">Type it exactly, in capitals.</p>` : ""}
    </div><div class="footer-cta"><button class="btn danger-btn" data-act="deleteAccount" ${ok ? "" : "disabled"}>Delete my account</button><button class="btn ghost" style="margin-top:8px" data-go="c-profile">Keep my account</button></div>`);
  }
});
const PAGES = [
  ["c-terms", "Terms and conditions", `<p>These terms cover ordering from Casual Kitchen Express (CKE) in the app. By placing an order you agree to them.</p>
    <h2>Orders and payment</h2><p>Prices are shown in the app before you pay. The app currently uses demo payments, and no money is taken.</p>
    <h2>Delivery</h2><p>We deliver from Uselu to Oluku Market for a flat delivery fee shown at checkout. Online orders and delivery run from 8:00 am to 6:00 pm. Pickup is available for any address.</p>
    <h2>Cancelling</h2><p>You can cancel before the kitchen acknowledges your order, for a full refund. After that you can request a cancellation, and a manager decides. Once your food is ready, it can’t be cancelled. Cancelling often can limit cancelling on your account.</p>
    <h2>Your account</h2><p>Keep your phone and Google account secure. You can deactivate or delete your account from Profile at any time.</p>
    <h2>Changes</h2><p>We may update these terms. The date at the bottom shows the latest version.</p><p class="muted">Last updated November 2026.</p>`],
  ["c-privacy", "Privacy policy", `<p>What we collect, why, and how to remove it.</p>
    <h2>What we collect</h2><ul><li>Your name and email, from Google, so we know whose order it is.</li><li>Your delivery address, pin, landmark, and phone number, so the rider can find you.</li><li>Your gender, only if you give it.</li><li>A profile photo, only if you add one. It’s compressed on your phone first.</li><li>Your orders, so you can track and reorder them.</li></ul>
    <h2>Payments</h2><p>Payments are demo only. No real card or bank details are collected.</p>
    <h2>Location</h2><p>We don’t track customers. Riders share their location only while carrying an order.</p>
    <h2>Removing your data</h2><p>Deactivate your account to take a break, or delete it to remove your details for good. Both are in Profile.</p>`],
  ["c-about", "About us", `<p>Casual Kitchen Express cooks home-style Nigerian meals in Ugbowo, close to the University of Benin, and gets them to you fast.</p>
    <h2>What we serve</h2><p>Jollof and fried rice, a rotating soup of the day with eba or pounded yam, proteins and sides, snacks, and cold drinks.</p>
    <h2>When</h2><p>Online orders and delivery from 8:00 am to 6:00 pm. Walk in until 8:30 pm.</p>
    <h2>Where we deliver</h2><p>From Uselu to Oluku Market.</p>`],
  ["c-support", "Support us", `<p>We’re a small kitchen. These things help us most:</p>
    <h2>Tell a friend</h2><p>Share the app with classmates and colleagues who want real food, fast.</p>
    <h2>Rate your orders</h2><p>A quick star rating after each delivery tells us what to keep and what to fix.</p>
    <h2>Follow us</h2><p>Find us on Instagram and TikTok for new dishes and daily specials.</p>
    <h2>Tell us what to improve</h2><p>Message us on WhatsApp with ideas or problems. We read everything.</p>`],
  ["c-partner", "Partner with us", `<p>We work with people and businesses around Ugbowo, Uselu, and Oluku.</p>
    <h2>Offices and hostels</h2><p>Regular lunch for a team or a hostel block, delivered at a set time.</p>
    <h2>Campus events</h2><p>Food for society meetings, departmental events, and celebrations.</p>
    <h2>Suppliers</h2><p>Local farmers and suppliers of rice, peppers, proteins, and packaging.</p>
    <h2>Get in touch</h2><p>Message us on WhatsApp or email ammycan6@gmail.com.</p>`],
  ["c-faq", "FAQs", `<h2>Where do you deliver?</h2><p>From Uselu to Oluku Market. Beyond Oluku Market you can order for pickup.</p>
    <h2>How much is delivery?</h2><p>A flat fee shown at checkout, whatever you order. Pickup is free.</p>
    <h2>When can I order online?</h2><p>From 8:00 am to 6:00 pm. Walk-in service runs until 8:30 pm.</p>
    <h2>What is the delivery code?</h2><p>A 4-digit code on your tracking screen. Give it to your rider at the door to confirm delivery.</p>
    <h2>Can I cancel?</h2><p>Yes, before the kitchen starts. After that you can send a request, and a manager decides.</p>
    <h2>Do I pay in the app?</h2><p>Yes, by card or bank transfer. The app currently uses demo payments, and no money is taken.</p>`]
];
screen("c-more", {
  title: "More", ids: ["CUS-26"],
  note: "<p>The fourth tab: a list of text pages that open and close like any other screen.</p>",
  render() {
    return shell(`<div class="topnav"><h1 style="padding-left:6px">More</h1></div><div class="scroll"><div class="card" style="padding:2px 14px">${PAGES.map(([id, t]) => `<button class="rowbtn" data-go="${id}"><span>${t}</span>${IC.chev}</button>`).join("")}</div>
      <p class="muted" style="font-size:12.5px;text-align:center">CKE app version 1.0.0 (demo)</p></div>`, { tabs: "c-more" });
  }
});
PAGES.forEach(([id, t, html]) => screen(id, {
  title: t, ids: ["CUS-26"],
  note: "<p>A plain text page opened from More. Back returns to the list.</p>",
  render() { return shell(`${topnav(t, "c-more")}<div class="scroll prose">${html}</div>`, { tabs: "c-more" }); }
}));
screen("c-closed", {
  title: "Closed after 6:00 pm", ids: ["CUS-24"],
  enter() { S.open = "closed"; },
  note: "<p>After 6:00 pm the menu stays open to browse, the open pill says when online orders start again, and checkout is switched off. Walk-in service continues at the counter until 8:30 pm.</p>",
  render() { return SCREENS["c-menu"].render(); }
});

/* ---------- actions ---------- */
Object.assign(ACT, {
  cat: d => { S.cat = d.v; },
  openItem: d => { S.itemId = d.id; S.opt = defaults(item(d.id)); S.qty = 1; go("c-item"); return false; },
  quickAdd: d => { addLine(mkLine(d.id)); toast(item(d.id).name + " added"); },
  opt: d => { S.opt = { ...S.opt, [d.k]: d.v }; },
  qty: d => { S.qty = Math.max(1, S.qty + Number(d.v)); },
  addItem: () => { addLine(mkLine(S.itemId, S.opt, S.qty)); toast(item(S.itemId).name + " added"); go("c-menu"); return false; },
  cartQty: d => { const c = S.cart[d.i]; c.qty += Number(d.v); if (c.qty <= 0) S.cart.splice(d.i, 1); },
  mode2: d => { S.mode2 = d.v; },
  google: () => { if (S.deactivated) { S.sheet = "reactivate"; return; } S.signedIn = true; S.name = S.name || "Ada Okoro"; S.email = S.email || "ada.okoro@gmail.com"; toast("Signed in with Google"); },
  editAddress: () => { S.draftPin = S.address.pin.slice(); S.draftArea = S.address.area; S.draftLabel = S.address.label; go("c-address"); return false; },
  label: d => { S.draftLabel = d.v; },
  placePin: (d, el, e) => { const svg = e.target.closest("svg"); const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const p = pt.matrixTransform(svg.getScreenCTM().inverse()); S.draftPin = [Math.round(p.x), Math.round(p.y)]; },
  toPickup: () => { S.mode2 = "pickup"; S.draftPin = S.address.pin.slice(); go("c-checkout"); return false; },
  saveAddress: () => { S.address = { ...S.address, label: S.draftLabel, area: S.draftArea, pin: S.draftPin }; S.hasAddress = true; toast("Address saved"); go("c-checkout"); return false; },
  pay: d => { S.pay = d.v; },
  payNow: () => { if (S.savedCard && S.pay === "card") return ACT.confirmPay(); go("c-pay"); return false; },
  confirmPayQuiet: () => { S.order = { no: "O-2173", mode: S.mode2, total: cartFood() + fee(), stage: 1, items: S.cart.map(c => item(c.id).name).join(", ") }; S.cart = []; },
  confirmPay: () => { S.order = { no: "O-2173", mode: S.mode2, total: cartFood() + fee(), stage: 1, items: S.cart.map(c => item(c.id).name).join(", ") }; S.cart = []; S.savedCard = true; go("c-paid"); return false; },
  sheet: d => { S.sheet = d.v; if (d.v === "cancel" || d.v === "request") { S.cReason = null; S.cAgree = false; } },
  cReason: d => { S.cReason = d.v; },
  oTab: d => { S.oTab = d.v; },
  openDeactivate: () => { S.deAgree = false; go("c-deactivate"); return false; },
  openDelete: () => { S.delAgree = false; S.delText = ""; go("c-delete"); return false; },
  deactivate: () => { if (!S.deAgree) return; S.deactivated = true; S.signedIn = false; S.deAgree = false; toast("Account deactivated. Sign in again to come back."); go("c-menu"); return false; },
  reactivate: () => { S.deactivated = false; S.sheet = null; S.signedIn = true; toast("Welcome back. Your account is active."); },
  closeSheet: () => { S.sheet = null; },
  doCancel: () => { if (!S.cReason || !S.cAgree) return false; S.order.cancelled = true; S.order.refund = "pending"; S.sheet = null; setTimeout(() => { if (S.order) { S.order.refund = "completed"; render(); } }, 2500); },
  doRequest: () => { if (!S.cReason || !S.cAgree) return false; S.order.requested = true; S.sheet = null; toast("Request sent"); },
  rate: d => { S.rating = Number(d.v); },
  reorder: () => { S.cart = S.history[0].lines.map(l => ({ ...l })); S.mode2 = "delivery"; go("c-checkout"); return false; },
  reorderPast: d => { S.cart = S.history[d.i].lines.map(l => ({ ...l })); go("c-checkout"); return false; },
  reorderCurrent: () => { S.cart = [mkLine("jollof"), mkLine("plantain")]; S.order = null; S.rating = 0; go("c-checkout"); return false; },
  appMode: d => { S.modePref = d.v; S.mode = d.v === "dark" ? "dark" : "light"; },
  pickPhoto: () => { S.sheet = "crop"; },
  savePhoto: () => { S.photo = true; S.sheet = null; toast("Photo saved"); },
  askRemovePhoto: () => { S.sheet = "removePhoto"; },
  removePhoto: () => { S.photo = false; S.sheet = null; toast("Photo removed"); },
  deleteAccount: () => { if (!(S.delAgree && S.delText === "DELETE ACCOUNT")) return false; resetState(); toast("Account deleted"); go("c-menu"); return false; },
  /* demo controls */
  dType: d => { setReturning(d.v === "returning"); S.order = null; S.cart = []; },
  dOpen: d => { S.open = d.v; },
  dMode: d => { S.mode = d.v; S.modePref = d.v; },
  dAdvance: d => { ensureOrder(); const max = (S.order.mode === "delivery" ? DELIVERY_STEPS : PICKUP_STEPS).length - 1; S.order.stage = Math.max(0, Math.min(max, S.order.stage + Number(d.v))); if (current() !== "c-track") { go("c-track"); return false; } },
  dDelivery: d => { ensureOrder(); S.order.mode = d.v; S.order.stage = Math.min(S.order.stage, (d.v === "delivery" ? DELIVERY_STEPS : PICKUP_STEPS).length - 1); },
  dFee: d => { S.fee = Number(d.v); toast("Delivery fee is now " + naira(S.fee) + " for new orders"); },
  dReset: () => { resetState(); go("c-menu"); return false; }
});
Object.assign(INPUT, {
  q: el => { S.q = el.value; const pos = el.selectionStart; render(); const n = document.querySelector('[data-input="q"]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } },
  gender: el => { S.gender = el.value; },
  name: el => { S.name = el.value; },
  area: el => { S.draftArea = el.value; },
  landmark: el => { S.address.landmark = el.value; },
  phone: el => { S.address.phone = el.value; },
  reason: el => { S.cancelReason = el.value; },
  cAgree: el => { S.cAgree = el.checked; render(); },
  deAgree: el => { S.deAgree = el.checked; render(); },
  delAgree: el => { S.delAgree = el.checked; render(); },
  delText: el => { S.delText = el.value; const pos = el.selectionStart; render(); const n = document.querySelector('[data-input="delText"]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
});
renderDemo = () => {
  const o = S.order;
  return seg("Customer", [["new", "First time"], ["returning", "Returning"]], S.returning ? "returning" : "new", "dType")
    + seg("Online ordering", [["open", "Open"], ["closed", "After 6:00 pm"], ["paused", "Paused"]], S.open, "dOpen")
    + seg("App theme", [["light", "Light"], ["dark", "Dark"]], S.mode, "dMode")
    + seg("Delivery fee (set by the manager)", [["1500", "₦1,500"], ["2000", "₦2,000"]], String(S.fee), "dFee")
    + seg("Tracking order type", [["delivery", "Delivery"], ["pickup", "Pickup"]], o ? o.mode : "delivery", "dDelivery")
    + `<div class="demo-row"><span>Order status${o ? ": " + (o.mode === "delivery" ? DELIVERY_STEPS : PICKUP_STEPS)[o.stage][0] : ""}</span><div class="seg"><button data-act="dAdvance" data-v="-1">Back a step</button><button data-act="dAdvance" data-v="1">Advance status</button></div></div>`
    + `<button class="wide" data-act="dReset">Reset the prototype</button>`;
};
FLOWS = [
  { name: "First order", screens: ["c-menu", "c-item", "c-cart", "c-checkout", "c-address", "c-pay", "c-paid", "c-track", "c-rate"] },
  { name: "Delivery edge cases", screens: ["c-range", "c-closed"] },
  { name: "Orders and account", screens: ["c-orders", "c-profile", "c-deactivate", "c-delete"] },
  { name: "More", screens: ["c-more", "c-terms", "c-privacy", "c-about", "c-support", "c-partner", "c-faq"] }
];
if (window.innerWidth <= 820) { const d = document.getElementById("flows-d"); if (d) d.open = false; }
boot("c-menu", "CKE customer app prototype");

</script>
</body>
</html>
